name: Create Pull Request

on:
  repository_dispatch:
    types: [create-pr]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate dispatch and create branch/PR through GitHub API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_BRANCH: ${{ github.event.client_payload.ReleaseBranchName }}
          PR_BASE: ${{ github.event.client_payload.PullRequestBase }}
          PR_TITLE: ${{ github.event.client_payload.PullRequestTitle }}
          PR_BODY: ${{ github.event.client_payload.PullRequestBody }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.RELEASE_BRANCH || '';
            const base = process.env.PR_BASE || '';
            const title = process.env.PR_TITLE || '';
            const body = process.env.PR_BODY || '';

            function validRefName(value) {
              return /^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$/.test(value) &&
                !value.includes('..') &&
                !value.includes('//') &&
                !value.includes('@{') &&
                !value.endsWith('.') &&
                !value.endsWith('/') &&
                !value.endsWith('.lock');
            }

            if (!validRefName(branch) || !validRefName(base)) {
              core.setFailed('Invalid repository_dispatch branch/base payload.');
              return;
            }
            if (title.length === 0 || title.length > 256 || body.length > 65536) {
              core.setFailed('Invalid repository_dispatch PR title/body size.');
              return;
            }

            const docsBranch = `${branch}-docs`;
            if (!validRefName(docsBranch)) {
              core.setFailed('Derived docs branch is invalid.');
              return;
            }

            const source = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            try {
              await github.rest.git.getRef({owner, repo, ref: `heads/${docsBranch}`});
              core.setFailed(`Ref ${docsBranch} already exists; refusing overwrite.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${docsBranch}`,
              sha: source.data.object.sha
            });

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${docsBranch}`,
              base,
              state: 'open'
            });
            if (pulls.data.length > 0) {
              core.info(`Pull request already exists: ${pulls.data[0].html_url}`);
              return;
            }

            const response = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: docsBranch,
              base,
              body
            });
            core.info(`Created pull request: ${response.data.html_url}`);
